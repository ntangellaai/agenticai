# Default deny all traffic in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow PostgreSQL to receive connections from both MCP servers (enterprise and UK)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-mcp-only
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mcp-server
                  - mcp-server-seuk
      ports:
        - port: 5432
          protocol: TCP
  # PostgreSQL does not need egress (no outbound connections)
  egress: []
