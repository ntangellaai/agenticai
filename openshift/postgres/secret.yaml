# NOTE: In production, generate secrets with:
#   oc create secret generic postgres-credentials \
#     --from-literal=POSTGRESQL_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=POSTGRESQL_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MCP_READONLY_PASSWORD="$(openssl rand -base64 24)" \
#     -n agenticai-demo
#
# This file uses placeholder values for reference only.
# NEVER commit real passwords to source control.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRESQL_ADMIN_PASSWORD: "CHANGE_ME_GENERATE_WITH_OPENSSL"
  POSTGRESQL_USER: "appuser"
  POSTGRESQL_PASSWORD: "CHANGE_ME_GENERATE_WITH_OPENSSL"
  POSTGRESQL_DATABASE: "enterprise_contracts"
  MCP_READONLY_USER: "mcp_readonly"
  MCP_READONLY_PASSWORD: "CHANGE_ME_GENERATE_WITH_OPENSSL"
