apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: mcp-server
data:
  # MCP server configuration
  config.json: |
    {
      "server": {
        "name": "enterprise-postgres-mcp",
        "version": "1.0.0",
        "port": 3000,
        "transport": "sse"
      },
      "database": {
        "maxConnections": 5,
        "statementTimeout": "30s",
        "idleTimeout": "60s"
      },
      "security": {
        "readOnly": true,
        "maxRowsPerQuery": 1000,
        "blockedKeywords": [
          "INSERT", "UPDATE", "DELETE", "DROP", "ALTER", "CREATE",
          "TRUNCATE", "GRANT", "REVOKE", "COPY", "EXECUTE", "DO ", "CALL "
        ],
        "allowedStatementPrefixes": ["SELECT", "WITH"],
        "blockedSchemas": ["pg_catalog", "information_schema"]
      },
      "tools": {
        "query": {
          "enabled": true,
          "description": "Execute a read-only SQL query against the enterprise contracts database"
        },
        "list_tables": {
          "enabled": true,
          "description": "List available tables in the enterprise database with descriptions"
        },
        "describe_table": {
          "enabled": true,
          "description": "Get column names, types, and descriptions for a specific table"
        }
      }
    }
