# MCP Server: accept connections from agent, connect to PostgreSQL
# Updated to support both mcp-server (port 3000) and mcp-server-seuk (port 3001)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-policy
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: mcp-server
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - mcp-server
          - mcp-server-seuk
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agent can connect to MCP servers on both ports
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
  egress:
    # MCP server can connect to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
