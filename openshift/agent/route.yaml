apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-route
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: agent
  annotations:
    # Rate limiting via HAProxy annotations
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "10"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "20"
    haproxy.router.openshift.io/timeout: "120s"
spec:
  host: agenticai-demo.apps.your-cluster.example.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: agent-svc
    weight: 100
  port:
    targetPort: http
