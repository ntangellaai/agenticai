apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-route
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: agent
  annotations:
    # Rate limiting - OCP 4.14+ compatible annotations
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "10"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "20"
    haproxy.router.openshift.io/timeout: "600s"
    # Disable HTTP/2 to avoid SSE buffering issues with HAProxy
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  # host: auto-assigned by OpenShift based on cluster's app domain
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: agent-svc
    weight: 100
  port:
    targetPort: http
