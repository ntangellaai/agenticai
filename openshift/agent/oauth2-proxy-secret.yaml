apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: agenticai-demo
type: Opaque
stringData:
  client-secret: changeme-client-secret        # Keycloak agenticai-agent client secret
  cookie-secret: changeme-cookie-secret-32chars  # Must be exactly 16, 24 or 32 raw characters (use: python3 -c "import secrets; print(secrets.token_hex(16))")
