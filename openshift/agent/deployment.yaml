apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: agenticai-demo
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: agent-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Built from agent/Dockerfile - pushed to internal registry
          image: image-registry.openshift-image-registry.svc:5000/agenticai-demo/agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: MCP_SERVER_URL
              value: "http://mcp-server-seuk-svc:3001"
            - name: LLM_API_KEY
              value: "not-required"
            - name: LLM_ENDPOINT
              # Local LLM in 'llm' namespace, service: llm-svc
              value: "http://llm-svc.llm.svc.cluster.local:8080/v1"
            - name: LLM_MODEL
              value: "ibm/granite-3.2-8b-instruct"
            - name: AGENT_PORT
              value: "8080"
            - name: MAX_TOOL_CALLS
              value: "5"
            - name: MAX_QUERY_LENGTH
              value: "2000"
            - name: LLM_TIMEOUT
              value: "360"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
