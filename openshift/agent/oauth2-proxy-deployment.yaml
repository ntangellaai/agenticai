apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: agenticai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --provider=keycloak-oidc
            - --client-id=agenticai-agent
            - --oidc-issuer-url=http://keycloak-service.keycloak.svc.cluster.local:8080/realms/demo
            - --insecure-oidc-skip-issuer-verification=true
            - --oidc-extra-audience=agenticai-agent
            - --upstream=http://agent-svc:8080
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://agentic-demo.apps.demo-0847.miscplatform.io/oauth2/callback
            - --email-domain=*
            - --scope=openid profile email
            - --ssl-insecure-skip-verify=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-httponly=true
            - --cookie-expire=8h
            - --session-store-type=cookie
            - --skip-provider-button=true
            - --pass-authorization-header=true
            - --pass-access-token=true
            - --set-authorization-header=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-svc
  namespace: agenticai-demo
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
