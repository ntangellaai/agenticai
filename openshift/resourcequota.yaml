apiVersion: v1
kind: ResourceQuota
metadata:
  name: agenticai-demo-quota
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/part-of: agenticai-demo
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "3"
    pods: "10"
    services: "5"
    secrets: "10"
    configmaps: "10"
