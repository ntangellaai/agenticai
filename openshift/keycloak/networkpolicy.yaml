apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agenticai-to-keycloak
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agenticai-demo
      ports:
        - port: 8080
          protocol: TCP
