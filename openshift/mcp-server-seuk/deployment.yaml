apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-seuk
  namespace: agenticai-demo
  labels:
    app.kubernetes.io/name: mcp-server-seuk
    app.kubernetes.io/part-of: agenticai-demo
    app.kubernetes.io/component: mcp-server-seuk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server-seuk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server-seuk
        app.kubernetes.io/part-of: agenticai-demo
        app.kubernetes.io/component: mcp-server-seuk
    spec:
      serviceAccountName: mcp-server-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: image-registry.openshift-image-registry.svc:5000/agenticai-demo/mcp-server:latest
          ports:
            - containerPort: 3001
              protocol: TCP
              name: http
          env:
            - name: PGHOST
              value: "postgres-svc"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "service_express_uk"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: MCP_READONLY_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: MCP_READONLY_PASSWORD
            - name: MCP_SERVER_PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
